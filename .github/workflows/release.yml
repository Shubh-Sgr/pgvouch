name: Release

# Stages a release on npm when a GitHub release is published (tag vX.Y.Z = package.json version).
# Uses npm trusted publishing: no npm token is stored in this repo. npm checks this workflow's
# OIDC identity and attaches a provenance statement that links the version to this repository,
# commit and workflow run (shown on npmjs.com as "Built and signed on GitHub Actions").
#
# Staged, not published: the version goes live only after a maintainer approves it with 2FA
# (npmjs.com -> pgvouch -> Staged Packages, or `npm stage approve <id>`). The trusted publisher
# is stage-only, so a compromised workflow or GitHub account can't publish on its own.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # lets npm verify this workflow (trusted publishing and provenance)

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Staged publishing needs npm 11.15.0 or newer (trusted publishing: 11.5.1).
      - run: npm install -g npm@^11.15.0
      # Publishing the wrong commit is the mistake to prevent: the release tag must be the
      # version in package.json (v0.4.1 -> 0.4.1).
      - name: Check the release tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi
      - run: npm ci
      # prepublishOnly runs the typecheck, the unit tests and a clean build first.
      # A GitHub pre-release goes to the "next" dist-tag, so `npm install pgvouch` doesn't get it.
      - run: npm stage publish --provenance --access public ${{ github.event.release.prerelease && '--tag next' || '' }}

  # Lists the new version in the official MCP Registry (io.github.Shubh-Sgr/pgvouch). The
  # registry checks the npm package, so this waits until a maintainer has approved the staged
  # version. Not approved within 2 hours: approve it, then "Re-run failed jobs" on this run.
  # Pre-releases are not listed.
  mcp-registry:
    name: Publish to the MCP Registry
    needs: publish
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 130
    permissions:
      contents: read
      id-token: write # the registry verifies this workflow's GitHub identity (no stored token)
    steps:
      - uses: actions/checkout@v7
      - name: Wait for the version to be approved on npm
        run: |
          version="$(node -p "require('./package.json').version")"
          for i in $(seq 1 120); do
            if curl -sf "https://registry.npmjs.org/pgvouch/$version" >/dev/null; then
              echo "pgvouch@$version is on npm"
              exit 0
            fi
            sleep 60
          done
          echo "::error::pgvouch@$version was not approved on npm within 2 hours. Approve it, then re-run this job."
          exit 1
      # Pinned version and checksum, so a changed download can't run with this job's identity.
      - name: Install mcp-publisher 1.8.1
        run: |
          curl -sfL -o mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
